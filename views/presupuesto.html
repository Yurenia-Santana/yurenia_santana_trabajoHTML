      <div class="navbar-superior"> <!--Nombre de la empresa que aparecerá en todas las páginas-->

  <main class="main-presupuesto"> <!--Formulario que comprueba los datos introducidos por el usuario-->
    <h2>¡Únete a nuestra escuela!</h2>
    <p>Infórmate de nuestros cursos sin compromiso</p>
  <form action="#" method="post">
    <fieldset>
      <legend>Datos personales</legend>
      <label for="nombre">Nombre</label><br />
      <input
        type="text"
        name="nombre"
        id="nombre"
        placeholder="Escriba su nombre"
        required
      /><br />

      <label for="email">Correo</label><br />
      <input
        type="email"
        name="correo"
        id="email"
        placeholder="Escriba su correo"
        required
      /><br />

      <label for="telefono">Telefono</label><br />
      <input
        type="tel"
        name="telefono"
        id="telefono"
        placeholder="Escriba su telefono"
        required
      /><br />
    </fieldset>

    <fieldset>
      <legend>Tu consulta</legend>
      <label for="info">Solicite más información</label><br />
    <textarea
    name="info"
    id="info"
    placeholder="Cuéntanos qué necesitas"
    required
></textarea><br />
    <div class="form-checkbox"> <!--Los usuarios aceptan la “Política de privacidad" de la empresa con este checkbox-->
    <input type="checkbox" name="privacidad" id="privacidad" required />
    <label for="privacidad">Acepto la política de privacidad</label>
</div>
</fieldset>
<button type="submit">Enviar</button> <!--Bortón de envío de la información suministrada por el usuario-->
  </form>
</main>
